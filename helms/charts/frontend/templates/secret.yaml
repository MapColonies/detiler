{{- $releaseName := .Release.Name -}}
{{- $chartName := include "frontend.name" . -}}
{{- if .Values.enabled -}}
{{- if ne .Values.env.app.baseMapXApiKey "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $releaseName }}-{{ $chartName }}-secret
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: {{ $chartName }}
    component: {{ $chartName }}
    environment: {{ include "frontend.environment" . }}
    release: {{ $releaseName }}
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
data:
  CONFIG_APP_BASEMAP_XAPIKEY_PLACEHOLDER: {{ .Values.env.app.baseMapXApiKey | b64enc }}
{{- end }}
{{- end }}
