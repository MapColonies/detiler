name: build_and_push

on:
  workflow_dispatch:
  push:
    branches:
      - feat/refactor
      - master

jobs:
  build_and_push:
    name: build and push image
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      matrix:
        include:
          - package: backend
            image: detiler-backend
          - package: frontend
            image: detiler-frontend
    steps:
      - uses: actions/checkout@v4

      - name: set short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_URL }}
          username: ${{ secrets.ACR_PUSH_USER }}
          password: ${{ secrets.ACR_PUSH_TOKEN }}

      - name: build and push
        run: |
          docker build -f packages/${{ matrix.package }}/Dockerfile \
            -t ${{ secrets.ACR_URL }}/${{ matrix.image }}:${{ env.SHORT_SHA }} .
          docker push ${{ secrets.ACR_URL }}/${{ matrix.image }}:${{ env.SHORT_SHA }}

  bump_vector_helms:
    name: bump image tags in vector-helms
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      # NOTE: the default secrets.GITHUB_TOKEN is minted per-run and scoped only to THIS repo
      # (detiler). It cannot authenticate against a different repository (vector-helms), so this
      # checkout/push will likely fail with a permission error unless that secret is backed by a
      # credential with real write access to MapColonies/vector-helms (a PAT, or a GitHub App
      # installation token exported under the same secret name). Swap the token source below once
      # that's set up.
      - name: checkout vector-helms
        uses: actions/checkout@v4
        with:
          repository: MapColonies/vector-helms
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: vector-helms

      - name: set short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: bump image tags
        working-directory: vector-helms
        run: |
          yq -i '.backend.image.tag = "${{ env.SHORT_SHA }}"' detiler-helms/values.yaml
          yq -i '.frontend.image.tag = "${{ env.SHORT_SHA }}"' detiler-helms/values.yaml

      - name: commit and push
        working-directory: vector-helms
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add detiler-helms/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(detiler): bump image tags to ${{ env.SHORT_SHA }}"
          git push
