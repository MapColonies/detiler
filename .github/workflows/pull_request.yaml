name: pull_request

on: [pull_request]

jobs:
  eslint:
    name: Run eslint
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Lerna
        run: npx lerna run build

      - name: Run typecheck
        run: npx lerna run typecheck

      - name: Run linters
        run: npm run lint

      - name: Run local linters
        run: npx lerna run lint:fix

  openapi-lint:
    name: Run openapi-lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [backend]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Lerna
        run: npx lerna run build

      - name: Run linters
        run: npm run lint

      - name: OpenAPI Lint Checks
        run: npx @redocly/cli lint --format=github-actions ./packages/${{ matrix.package }}/openapi3.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Lerna
        run: npx lerna run build

      - name: Run tests
        run: npx lerna run test

      - uses: actions/upload-artifact@v4
        with:
          name: Test Reporters
          path: packages/**/reports/**

  build_image:
    name: Build Image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [backend, frontend]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: build Docker image
        run: docker build -f ./packages/${{ matrix.package }}/Dockerfile -t ${{ matrix.package }}:latest .
